name: SmartUI PS17 CI

on:
  push:
    branches:
      - smartui-ps17.2-dev
      - smartui-2.1-beta.1
    tags:
      - v2.1.0-beta.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_CORE_VERSION: 6.1.19
  PYTHON_VERSION: '3.11'

jobs:
  build-uf2:
    name: Build UF2 — ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: T096 FEM ON
            artifact_id: t096-fem
            environment: Heltec_t096_companion_radio_ble_femon
            uf2_name: T096_FEM_SmartUI_2.1.0-beta.1.uf2
          - board: T114
            artifact_id: t114
            environment: Heltec_t114_companion_radio_ble
            uf2_name: T114_SmartUI_2.1.0-beta.1.uf2
          - board: ProMicro RA62
            artifact_id: promicro-ra62
            environment: ProMicro_ra62_companion_radio_ble
            uf2_name: ProMicro_RA62_SmartUI_2.1.0-beta.1.uf2

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore PlatformIO dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps/${{ matrix.environment }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'variants/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Build release-named UF2
        env:
          UF2_FILE_PATH: ${{ github.workspace }}/firmware/${{ matrix.uf2_name }}
        run: |
          set -euo pipefail
          mkdir -p firmware
          pio run -e "${{ matrix.environment }}" -t create_uf2
          test -s "${UF2_FILE_PATH}"

      - name: Upload board UF2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: uf2-${{ matrix.artifact_id }}
          path: firmware/${{ matrix.uf2_name }}
          if-no-files-found: error
          retention-days: 14

  validate-uf2:
    name: Validate and package the three nRF52 UF2 files
    needs: build-uf2
    runs-on: ubuntu-latest

    steps:
      - name: Check out validation tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all board UF2 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: uf2-*
          path: firmware
          merge-multiple: true

      - name: Validate UF2 structure, family and release markers
        run: python tools/validate_release_uf2.py firmware

      - name: Generate SHA256 checksums
        working-directory: firmware
        run: sha256sum -- *.uf2 > SHA256SUMS.txt

      - name: Upload validated firmware bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smartui-ps17-validated-uf2
          path: |
            firmware/*.uf2
            firmware/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  build-esp32:
    name: Build ESP32-S3 BIN — ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Heltec V4.3 OLED FEM ON
            artifact_id: heltec-v4-3-oled-fem
            environment: heltec_v4_3_companion_radio_ble_femon_smartui
            stem: Heltec_V4.3_OLED_FEMON_SmartUI_2.1.0-beta.1
          - board: Heltec Wireless Paper WOOD
            artifact_id: wireless-paper-wood
            environment: Heltec_Wireless_Paper_companion_radio_ble_smartui_wood
            stem: Heltec_Wireless_Paper_WOOD_SmartUI_2.1.0-beta.1
          - board: Heltec Wireless Paper FULL
            artifact_id: wireless-paper-full
            environment: Heltec_Wireless_Paper_companion_radio_ble_smartui_full
            stem: Heltec_Wireless_Paper_FULL_SmartUI_2.1.0-beta.1

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore PlatformIO dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps/${{ matrix.environment }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'variants/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Build fresh-install and update images
        run: |
          set -euo pipefail
          mkdir -p firmware
          pio run -e "${{ matrix.environment }}" -t mergebin
          build_dir=".pio/build/${{ matrix.environment }}"
          test -s "${build_dir}/firmware-merged.bin"
          test -s "${build_dir}/firmware.bin"
          cp "${build_dir}/firmware-merged.bin" "firmware/${{ matrix.stem }}-freshInstall-merged.bin"
          cp "${build_dir}/firmware.bin" "firmware/${{ matrix.stem }}-update.bin"

      - name: Upload board BIN pair
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bin-${{ matrix.artifact_id }}
          path: firmware/${{ matrix.stem }}-*.bin
          if-no-files-found: error
          retention-days: 14

  validate-esp32:
    name: Validate and package ESP32-S3 BIN pairs
    needs: build-esp32
    runs-on: ubuntu-latest

    steps:
      - name: Check out validation tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all ESP32 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: bin-*
          path: firmware
          merge-multiple: true

      - name: Validate ESP image headers, app slices and markers
        run: python tools/validate_release_esp32.py firmware

      - name: Generate SHA256 checksums
        working-directory: firmware
        run: sha256sum -- *.bin > SHA256SUMS-ESP32.txt

      - name: Upload validated ESP32 firmware bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smartui-ps17-validated-esp32-bin
          path: |
            firmware/*.bin
            firmware/SHA256SUMS-ESP32.txt
          if-no-files-found: error
          retention-days: 30

  build-display-compatibility:
    name: Shared display compatibility — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - Heltec_v3_companion_radio_ble
          - Xiao_S3_WIO_companion_radio_ble
          - Heltec_t1_companion_radio_usb

    # Compile-only representatives of shared display backends. These boards
    # are not added to the supported SmartUI release or its downloadable files.
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore PlatformIO dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps/${{ matrix.environment }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'variants/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Compile shared-backend representative
        run: pio run -e "${{ matrix.environment }}"

  native-tests:
    name: Native tests — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - native
          - native_kiss_modem
          - native_serial_raw_line

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore native-test dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            .pio/libdeps/${{ matrix.environment }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-
            ${{ runner.os }}-${{ runner.arch }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Run native test environment
        run: pio test -e "${{ matrix.environment }}"

  ui-qa:
    name: Static and framebuffer UI QA
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-qa.txt

      - name: Install pinned QA dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-qa.txt

      - name: Check SmartUI contract
        run: python tools/audit_smartui_ps17_contract.py

      - name: Check SSD1306 font profile guards
        run: python tools/test_ssd1306_font_profiles.py

      - name: Run exact display simulation
        run: python tools/simulate_smartui_ps17_qa.py --out-dir qa_outputs/ci

      - name: Run Heltec V4.3 OLED chrome simulation
        run: python tools/simulate_v4_3_oled_qa.py --out-dir qa_outputs/v4_3_oled

      - name: Run Wireless Paper 250x122 simulation
        run: python tools/simulate_wireless_paper_ps17_qa.py --out-dir qa_outputs/wireless_paper

      - name: Check confirmed-choice lists with embedded glyph tables
        run: python tools/simulate_dev2_settings.py

      - name: Upload framebuffer QA output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smartui-framebuffer-qa
          path: qa_outputs
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Required beta release gate
    needs:
      - validate-uf2
      - validate-esp32
      - build-display-compatibility
      - native-tests
      - ui-qa
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required job succeeded
        run: echo "All supported builds, native tests and framebuffer checks passed."

  publish-beta-release:
    name: Publish or update beta release
    if: github.ref == 'refs/tags/v2.1.0-beta.1'
    needs: release-gate
    runs-on: ubuntu-latest
    concurrency:
      group: publish-beta-release-v2.1.0-beta.1
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download validated UF2 bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: smartui-ps17-validated-uf2
          path: release

      - name: Download validated ESP32-S3 bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: smartui-ps17-validated-esp32-bin
          path: release

      - name: Build the all-five-boards archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          cp RELEASE_NOTES_v2.1.0-beta.1_RU.md release/
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          root = Path("release")
          payloads = sorted(
              p for p in root.iterdir()
              if p.suffix in {".uf2", ".bin", ".txt", ".md"}
          )
          manifest = {
              "tag": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "files": [
                  {
                      "name": p.name,
                      "bytes": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
                  for p in payloads
              ],
          }
          manifest_path = root / "RELEASE-MANIFEST.json"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          archive = root / "MeshCore_SmartUI_2.1.0-beta.1_all-five-boards.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in payloads + [manifest_path]:
                  zf.write(path, path.name)
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
          PY

      - name: Create or update the single beta release page
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="MeshCore SmartUI v2.1.0-beta.1"
          notes="RELEASE_NOTES_v2.1.0-beta.1_RU.md"
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          status="$({
            curl --silent --show-error --location \
              --output "$release_json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          })"

          case "$status" in
            200)
              # Keep the same release page for this tag and explicitly retain
              # its published prerelease state before replacing its assets.
              gh release edit "$tag" \
                --title "$title" \
                --notes-file "$notes" \
                --prerelease \
                --draft=false \
                --verify-tag \
                --repo "$GITHUB_REPOSITORY"

              release_id="$(python -c \
                'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' \
                "$release_json")"
              old_asset_ids="$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[].id')"
              if [[ -n "$old_asset_ids" ]]; then
                while IFS= read -r asset_id; do
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done <<< "$old_asset_ids"
              fi

              gh release upload "$tag" release/* \
                --repo "$GITHUB_REPOSITORY"
              ;;
            404)
              gh release create "$tag" release/* \
                --title "$title" \
                --notes-file "$notes" \
                --prerelease \
                --verify-tag \
                --repo "$GITHUB_REPOSITORY"
              ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              cat "$release_json" >&2
              exit 1
              ;;
          esac

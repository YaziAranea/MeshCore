; Explicit display-free builds for the SAME board wiring as the public profiles.
; Keep DISPLAY_CLASS so the nonvisual notification and battery task is compiled.
; These are source-build targets, not additional hardware support or release assets.
[env:SmartUI_T096_headless]
extends = env:Heltec_t096_companion_radio_ble_femon
build_flags = ${env:Heltec_t096_companion_radio_ble_femon.build_flags}
  -D SMARTUI_HEADLESS=1


[Heltec_t096]
extends = nrf52_base
board = heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_t096
  -I src/helpers/ui
  -D HELTEC_T096
;  -D NRF52_POWER_MANAGEMENT
  -D P_LORA_DIO_1=21
  -D P_LORA_NSS=5
  -D P_LORA_RESET=16
  -D P_LORA_BUSY=19
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=28
  -D PIN_MSG_ALERT=45
  -D PIN_MSG_ALERT_ACTIVE=HIGH
  -D PIN_MSG_TONE=31
  -D DEFAULT_NOTIFY_GPIO_PIN=45
  -D DEFAULT_NOTIFY_TONE_PIN=31
  -D P_LORA_PA_POWER=30  ;VFEM_Ctrl -LDO power enable
  -D P_LORA_KCT8103L_PA_CSD=12
  -D P_LORA_KCT8103L_PA_CTX=41
  -D LORA_TX_POWER=9      ; 9dBm + ~13dB KCT8103L gain = ~22dBm output
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output -> ~28dBm at antenna
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_VEXT_EN=26   ; Vext is connected to VDD which is also connected to TFT & GPS
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_GPS_RX=25
  -D PIN_GPS_TX=23
  -D PIN_GPS_EN=GPS_EN
  -D PIN_GPS_EN_ACTIVE=LOW
  -D PIN_GPS_RESET=GPS_RESET
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D GPS_BAUD_RATE=115200
  -D PIN_VBAT_READ=BATTERY_PIN
  -D PIN_BAT_CTL=47
  -D DISPLAY_CLASS=ST7735Display
  -D DISPLAY_ROTATION=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_t096>
  +<helpers/ui/ST7735Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  bodmer/TFT_eSPI @ 2.5.43
debug_tool = jlink
upload_protocol = nrfutil

[env:Heltec_t096_repeater]
extends = Heltec_t096
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_repeater>

build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
;  -D POWERSAVING_DEBUG=1

[env:Heltec_t096_repeater_bridge_rs232]
extends = Heltec_t096
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_RS232_BRIDGE=Serial2
  -D WITH_RS232_BRIDGE_RX=9
  -D WITH_RS232_BRIDGE_TX=10
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<helpers/bridges/RS232Bridge.cpp>
  +<../examples/simple_repeater>

[env:Heltec_t096_room_server]
extends = Heltec_t096
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:Heltec_t096_sensor]
extends = Heltec_t096
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_sensor>
lib_deps =
  ${Heltec_t096.lib_deps}

[env:Heltec_t096_companion_radio_ble_femon]
extends = Heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags = -Ofast
build_flags =
  ${Heltec_t096.build_flags}
  -Os
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D ENV_INCLUDE_GPS=1   ; enable the GPS page in UI
  -D AUTO_SHUTDOWN_MILLIVOLTS=3200
  -D LOW_BATTERY_SHUTDOWN_FLOOR_MILLIVOLTS=2700
  -D UI_ADC_MULTIPLIER_PAGE=1
  -D UI_LOW_BATTERY_SHUTDOWN_PAGE=1
  -D UI_HOME_START_PAGE_FIRST=0
  -D UI_CLOCK_PAGE_VISIBLE=1
  -D UI_FIRST_PAGE_SAFE_CLOCK=1
  -D UI_FIRST_PAGE_SHOW_MCU_TEMP=1
  -D UI_HIDE_FIRST_PAGE=1
  -D UI_AUTO_ADVERT_PAGE=1
  -D UI_BLE_PIN_PAGE=1
  -D BLE_PIN_PERSIST_RANDOM=1
  -D UI_CHAT_LIST_SIZE=15
  -D UI_BATTERY_SAMPLE_MILLIS=5000UL
  -D UI_BATTERY_SMOOTHING_SAMPLES=12
  -D UI_BATTERY_DISPLAY_HYSTERESIS_MV=25
  -D UI_NOTIFY_ONLY_IMPORTANT_MESSAGES=1
  -D UI_UNREAD_DIRECT_ONLY=1
  -D UI_MENTION_REQUIRE_AT=1
  -D UI_MENTION_ALLOW_PLAIN_NODE_NAME=1
  -D UI_MENTION_ALLOW_PLAIN_FIRST_TOKEN=1
  -D UI_MENTION_PLAIN_FIRST_TOKEN_MIN_CHARS=3
  -D UI_IMPORTANT_NOTIFY_SUPPRESS_STANDARD=1
  -D UI_IMPORTANT_NOTIFY_WAKE_DISPLAY=1
  -D UI_POPUP_WAKE_WHEN_BLE_CONNECTED=1
  -D UI_IMPORTANT_NOTIFY_LOCAL_ONLY_WHEN_DISCONNECTED=1
  -D UI_BLE_READ_FINISHES_IMPORTANT_NOTIFY=1
  -D UI_IMPORTANT_NOTIFY_BLE_SMART_DELAY_MS=8000UL
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_TONE_REPEAT=1
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_VISUAL_REPEAT=1
  -D UI_SMART_NOTIFY_WATCHER=1
  -D UI_SMART_NOTIFY_WATCHER_CANCEL_PENDING_ON_BLE_READ=0
  -D UI_SMART_NOTIFY_WATCHER_FINISH_ACTIVE_ON_BLE_READ=1
  -D UI_IMPORTANT_NOTIFY_VISUAL_BURST_MS=3500UL
  -D UI_MENU_AUTO_HOME_MILLIS=30000UL
  -D UI_NOTIFY_LED_OVERRIDES_BOARD_LED_SETTING=1
  -D UI_IMPORTANT_NOTIFY_TONE_REPEAT_MS=120000UL
  -D UI_OFFLINE_IMPORTANT_NOTIFY_BURST_COUNT=1
  -D UI_OFFLINE_IMPORTANT_NOTIFY_BURST_GAP_MS=2000UL
  -D UI_IMPORTANT_NOTIFY_TONE_PLAYS=2
  -D UI_IMPORTANT_NOTIFY_TONE_REPEAT_GAP_MS=2000UL
  -D UI_IMPORTANT_NOTIFY_TONE_SERIES_ONCE=1
  -D UI_NIGHT_MODE_PROMPT=1
  -D UI_OFFLINE_DM_LED_PAGE=1
  -D UI_FORCE_IMPORTANT_NOTIFY_MODE=1
  -D UI_NOTIFY_GPIO_SELECT=1
  -D UI_BLOCK_BOARD_LED_NOTIFY=1
  -D DEFAULT_NOTIFY_REPAIR_LEGACY=1
  -D UI_TONE_BRIDGE_PAGE=1
  -D UI_TONE_8BIT_PAGE=1
  -D UI_TONE_HIGH_DRIVE_PAGE=1
  -D UI_TONE_RESONANCE_PAGE=1
  -D UI_COMPACT_SETTINGS_MENU=1
  -D UI_SMART_B11_EXTRAS=1
  -D UI_SMART_B12_TONE_LIST=1
  -D UI_QUICK_REPLY_KEYBOARD=1
  -D DEFAULT_NOTIFY_TONE_HIGH_DRIVE=1
  -D DEFAULT_NOTIFY_TONE_BRIDGE_PIN=29
  -D UI_T096_PREMIUM_TFT=1
  -D UI_V4_3_OLED_PROFILE=1
  -D UI_SDVIG_NETWORK_LAYOUT=1
  -D MESHCORE_UI_VERSION='"T096 SmartUI 2.1.0-beta.1"'
  -D BLE_TIME_SYNC_ACCEPT_BACKWARD=1
  -D RADIO_FEM_RXGAIN=1
;  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
;  -D POWERSAVING_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_t096.lib_deps}
  densaugeo/base64 @ 1.4.0

[env:Heltec_t096_companion_radio_ble_femoff]
extends = env:Heltec_t096_companion_radio_ble_femon
build_flags =
  ${env:Heltec_t096_companion_radio_ble_femon.build_flags}
  -D RADIO_FEM_RXGAIN=0 ; undefined (default on), 1=on, 0=off

[env:Heltec_t096_companion_radio_usb]
extends = Heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${Heltec_t096.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
;  -D BLE_PIN_CODE=123456
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_t096.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Heltec_t096_kiss_modem]
extends = Heltec_t096
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/kiss_modem/>

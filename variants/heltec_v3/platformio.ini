[env:Heltec_v3_companion_radio_usb]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Heltec_v3_companion_radio_ble]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  -D AUTO_SHUTDOWN_MILLIVOLTS=3200
  -D LOW_BATTERY_SHUTDOWN_FLOOR_MILLIVOLTS=2700
  -D UI_LOW_BATTERY_SHUTDOWN_PAGE=1
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Heltec_v3_companion_radio_wifi]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Full experimental SmartUI for WiFi LoRa 32 V3 with the onboard 128x64 OLED.
; Keep the upstream-compatible companion environment unchanged. V3 has no
; onboard GPS, FEM, buzzer or vibration motor: do not inherit virtual devices.
[env:Heltec_v3_companion_radio_ble_smartui]
extends = env:Heltec_v3_companion_radio_ble
; Explicit clean-install packaging only: never used by firmware.bin updates.
custom_smartui_fresh_spiffs = yes
platform_packages =
  ${esp32_base.platform_packages}
  platformio/tool-mkspiffs @ 2.230.0
build_unflags =
  -DENV_INCLUDE_GPS=1
  -DBLE_DEBUG_LOGGING=1
  -DPIN_GPS_RX=47
  -DPIN_GPS_TX=48
  -DPIN_GPS_EN=26
build_flags =
  ${env:Heltec_v3_companion_radio_ble.build_flags}
  -D ENV_INCLUDE_GPS=0
  -D UI_PHONE_GPS=0
  -D PIN_MSG_ALERT=P_LORA_TX_LED
  -D DEFAULT_NOTIFY_GPIO_PIN=P_LORA_TX_LED
  -D UI_TONE_FALLBACK_TO_ALERT=0
  -D UI_NOTIFY_GPIO_SELECT=1
  -D DEFAULT_NOTIFY_REPAIR_LEGACY=1
  -D UI_V4_3_OLED_PROFILE=1
  -D UI_BLE_PIN_PAGE=1
  -D BLE_PIN_PERSIST_RANDOM=1
  -D UI_HIDE_FIRST_PAGE=1
  -D UI_COLOR_APPEARANCE_MENU=0
  -D UI_BACKLIGHT_TIMEOUT_PAGE=0
  -D UI_AUTO_ADVERT_PAGE=1
  -D UI_SDVIG_NETWORK_LAYOUT=1
  -D UI_ADC_MULTIPLIER_PAGE=1
  -D UI_MENU_AUTO_HOME_MILLIS=30000UL
  -D UI_NOTIFY_ONLY_IMPORTANT_MESSAGES=1
  -D UI_UNREAD_DIRECT_ONLY=1
  -D UI_MENTION_REQUIRE_AT=1
  -D UI_MENTION_ALLOW_PLAIN_NODE_NAME=1
  -D UI_MENTION_ALLOW_PLAIN_FIRST_TOKEN=1
  -D UI_MENTION_PLAIN_FIRST_TOKEN_MIN_CHARS=3
  -D UI_IMPORTANT_NOTIFY_SUPPRESS_STANDARD=1
  -D UI_IMPORTANT_NOTIFY_WAKE_DISPLAY=1
  -D UI_POPUP_WAKE_WHEN_BLE_CONNECTED=1
  -D UI_IMPORTANT_NOTIFY_LOCAL_ONLY_WHEN_DISCONNECTED=1
  -D UI_BLE_READ_FINISHES_IMPORTANT_NOTIFY=1
  -D UI_IMPORTANT_NOTIFY_BLE_SMART_DELAY_MS=8000UL
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_TONE_REPEAT=1
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_VISUAL_REPEAT=1
  -D UI_SMART_NOTIFY_WATCHER=1
  -D UI_SMART_NOTIFY_WATCHER_CANCEL_PENDING_ON_BLE_READ=0
  -D UI_SMART_NOTIFY_WATCHER_FINISH_ACTIVE_ON_BLE_READ=1
  -D UI_IMPORTANT_NOTIFY_VISUAL_BURST_MS=3500UL
  -D UI_IMPORTANT_NOTIFY_TONE_REPEAT_MS=120000UL
  -D UI_OFFLINE_IMPORTANT_NOTIFY_BURST_COUNT=2
  -D UI_OFFLINE_IMPORTANT_NOTIFY_BURST_GAP_MS=3000UL
  -D UI_NIGHT_MODE_PROMPT=1
  -D UI_OFFLINE_DM_LED_PAGE=1
  -D UI_FORCE_IMPORTANT_NOTIFY_MODE=1
  -D UI_COMPACT_SETTINGS_MENU=1
  -D UI_SOUND_SETTINGS_GROUP=0
  -D UI_SMART_B11_EXTRAS=1
  -D UI_SMART_B12_TONE_LIST=1
  -D UI_QUICK_REPLY_KEYBOARD=1
  -D BLE_TIME_SYNC_ACCEPT_BACKWARD=1
  -D MESHCORE_UI_VERSION='"V3 OLED SmartUI 2.1.0-experimental.1 FS1"'


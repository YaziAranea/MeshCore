[Heltec_Wireless_Paper_base]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_wireless_paper
  -D HELTEC_WIRELESS_PAPER
  ;-D ARDUINO_USB_CDC_ON_BOOT=1      ; this breaks Serial
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=18
  ;-D PIN_BOARD_SDA=17
  ;-D PIN_BOARD_SCL=18               ; same GPIO as P_LORA_TX_LED
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=45
  -D ADC_MULTIPLIER=8.4
  -D PIN_VBAT_READ=20
  -D PIN_ADC_CTRL=19
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D DISP_CS=4
  -D DISP_BUSY=7
  -D DISP_DC=5
  -D DISP_RST=6
  -D DISP_SCLK=3
  -D DISP_MOSI=2
  -D ARDUINO_heltec_wifi_lora_32_V3
  -D WIRELESS_PAPER
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_wireless_paper>
lib_deps =
  ${esp32_base.lib_deps}
  https://github.com/todd-herbert/heltec-eink-modules/archive/9207eb6ab2b96f66298e0488740218c17b006af7.zip

[env:Heltec_Wireless_Paper_companion_radio_ble]
extends = Heltec_Wireless_Paper_base
build_flags =
  ${Heltec_Wireless_Paper_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=E213Display
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Heltec_Wireless_Paper_base.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_Wireless_Paper_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  bakercp/CRC32 @ ^2.0.0

; Shared SmartUI profile for the 250x122 e-paper panel.  GPIO45/VEXT powers
; both the panel and LoRa front end, therefore display auto-off must stay off.
[Heltec_Wireless_Paper_companion_smartui_common]
extends = env:Heltec_Wireless_Paper_companion_radio_ble
build_flags =
  ${env:Heltec_Wireless_Paper_companion_radio_ble.build_flags}
  -D AUTO_SHUTDOWN_MILLIVOLTS=3200
  -D LOW_BATTERY_SHUTDOWN_FLOOR_MILLIVOLTS=2700
  -D UI_LOW_BATTERY_SHUTDOWN_PAGE=1
  -UBLE_DEBUG_LOGGING
  -D ESP32_CPU_FREQ=80
  -D AUTO_OFF_MILLIS=0
  -D MESHCORE_E213_PROFILE_FONTS=1
  -D UI_EINK_IDLE_SCREENSAVER=1
  -D UI_WIRELESS_PAPER_BIG_CLOCK=1
  -D UI_EINK_IDLE_SCREENSAVER_MILLIS=60000UL
  -D UI_EINK_SAVER_REFRESH_MILLIS=60000UL
  -D UI_CLOCK_REFRESH_MILLIS=60000UL
  -D UI_IDLE_REFRESH_MILLIS=60000UL
  -D UI_CHAT_REFRESH_MILLIS=8000UL
  -D UI_EINK_SCROLL_REFRESH_MILLIS=8000UL
  -D UI_CHAT_SCROLL_STEP_PX=11
  -D UI_CHAT_EDGE_PAUSE_MILLIS=8000UL
  -D UI_TEXT_MARQUEE_ENABLE=0
  -D UI_HOME_START_PAGE_FIRST=0
  -D UI_CLOCK_PAGE_VISIBLE=1
  -D UI_BLE_PIN_PAGE=1
  -D BLE_PIN_PERSIST_RANDOM=1
  -D UI_FIRST_PAGE_SAFE_CLOCK=1
  -D UI_FIRST_PAGE_SHOW_MCU_TEMP=1
  -D UI_HIDE_FIRST_PAGE=1
  -D UI_RECENT_LIST_SIZE=8
  -D UI_CHAT_LIST_SIZE=15
  -D UI_BATTERY_SAMPLE_MILLIS=5000UL
  -D UI_BATTERY_SMOOTHING_SAMPLES=12
  -D UI_BATTERY_DISPLAY_HYSTERESIS_MV=25
  -D UI_AUTO_ADVERT_PAGE=1
  -D UI_SDVIG_NETWORK_LAYOUT=1
  -D UI_ADC_MULTIPLIER_PAGE=1
  -D UI_MENU_AUTO_HOME_MILLIS=30000UL
  -D UI_COLOR_APPEARANCE_MENU=0
  -D UI_BACKLIGHT_TIMEOUT_PAGE=0
  -D UI_PHONE_GPS=0
  -D UI_NOTIFY_ONLY_IMPORTANT_MESSAGES=1
  -D UI_UNREAD_DIRECT_ONLY=1
  -D UI_MENTION_REQUIRE_AT=1
  -D UI_MENTION_ALLOW_PLAIN_NODE_NAME=1
  -D UI_MENTION_ALLOW_PLAIN_FIRST_TOKEN=1
  -D UI_MENTION_PLAIN_FIRST_TOKEN_MIN_CHARS=3
  -D UI_IMPORTANT_NOTIFY_SUPPRESS_STANDARD=1
  -D UI_IMPORTANT_NOTIFY_WAKE_DISPLAY=1
  -D UI_POPUP_WAKE_WHEN_BLE_CONNECTED=1
  -D UI_IMPORTANT_NOTIFY_LOCAL_ONLY_WHEN_DISCONNECTED=1
  -D UI_BLE_READ_FINISHES_IMPORTANT_NOTIFY=1
  -D UI_IMPORTANT_NOTIFY_BLE_SMART_DELAY_MS=8000UL
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_TONE_REPEAT=1
  -D UI_BLE_READ_SUPPRESSES_IMPORTANT_VISUAL_REPEAT=1
  -D UI_SMART_NOTIFY_WATCHER=1
  -D UI_SMART_NOTIFY_WATCHER_CANCEL_PENDING_ON_BLE_READ=0
  -D UI_SMART_NOTIFY_WATCHER_FINISH_ACTIVE_ON_BLE_READ=1
  -D UI_IMPORTANT_NOTIFY_VISUAL_BURST_MS=3500UL
  -D UI_FORCE_IMPORTANT_NOTIFY_MODE=1
  -D UI_NIGHT_MODE_PROMPT=1
  -D UI_COMPACT_SETTINGS_MENU=1
  -D UI_COMPACT_SETTINGS_MAX_ROWS=8
  -D UI_SOUND_SETTINGS_GROUP=0
  -D UI_NOTIFICATION_SETTINGS=0
  -D UI_SMART_B11_EXTRAS=1
  -D UI_SMART_B12_TONE_LIST=1
  -D BLE_TIME_SYNC_ACCEPT_BACKWARD=1

; Recommended e-paper build: all status/chat/settings UI, without the
; per-keystroke refresh cost of the on-device keyboard.
[env:Heltec_Wireless_Paper_companion_radio_ble_smartui_wood]
extends = Heltec_Wireless_Paper_companion_smartui_common
build_flags =
  ${Heltec_Wireless_Paper_companion_smartui_common.build_flags}
  -D MESHCORE_UI_VERSION='"Wireless Paper SmartUI 2.1.0-dev.2 WOOD"'

; Feature-parity build.  Keyboard and target picker work, but cursor movement
; physically refreshes e-paper; periodic full refresh limits ghosting.
[env:Heltec_Wireless_Paper_companion_radio_ble_smartui_full]
extends = Heltec_Wireless_Paper_companion_smartui_common
build_flags =
  ${Heltec_Wireless_Paper_companion_smartui_common.build_flags}
  -D E213_FULL_REFRESH_EVERY=24
  -D UI_QUICK_REPLY_KEYBOARD=1
  -D MESHCORE_UI_VERSION='"Wireless Paper SmartUI 2.1.0-dev.2 FULL"'

[env:Heltec_Wireless_Paper_companion_radio_usb]
extends = Heltec_Wireless_Paper_base
build_flags =
  ${Heltec_Wireless_Paper_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=E213Display
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${Heltec_Wireless_Paper_base.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_Wireless_Paper_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  bakercp/CRC32 @ ^2.0.0

[env:Heltec_Wireless_Paper_repeater]
extends = Heltec_Wireless_Paper_base
build_flags =
  ${Heltec_Wireless_Paper_base.build_flags}
  -D DISPLAY_CLASS=E213Display
  -D ADVERT_NAME='"Heltec WP Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_Wireless_Paper_base.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_Wireless_Paper_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

